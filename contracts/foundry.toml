[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
# executeSwap takes ten arguments and hashes nine of them; that exhausts the
# stack under the legacy codegen. Prague because X Layer is on it (that is
# what makes the EIP-7702 delegation this contract relies on possible).
via_ir = true
evm_version = "prague"
