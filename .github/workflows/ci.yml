name: ci
on: [push, pull_request]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if env files or key material are tracked
        run: |
          set -e
          # The pre-commit hook checks staged changes; CI checks the tree, so a
          # commit made without hooks still fails the build.
          bad=$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.pem$|\.key$|sui\.keystore$|(^|/)sui_config/' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Secret-shaped files tracked:"; echo "$bad"; exit 1; fi
          if git grep -nE 'suiprivkey1[0-9a-z]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- . ':!*.md'; then
            echo "Private key material found in tree"; exit 1
          fi
          echo "secret scan OK"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r server/requirements.txt
      - run: cd server && python -m pytest tests/ -q

  # ---------------------------------------------------------------------------
  # Compile check only. CI does NOT build the deployed bundle and does not
  # publish anything: the server builds its own, with scripts/build-frontend-
  # local.sh, into a staging directory it swaps in only on success.
  #
  # What this job is still for is the thing a local build cannot tell you —
  # whether the tree compiles for someone who is not on the deploy box, from a
  # clean checkout and a lockfile install. That is the failure a contributor
  # actually hits.
  #
  # It builds WITHOUT VITE_PRIVY_APP_ID and that is fine here, because nothing
  # built here is served. A bundle compiled without it is a different
  # application — Privy disabled, no Google sign-in, no embedded wallet — so it
  # must never be deployed. It never leaves the runner.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Build (compile check — not the deployed bundle)
        working-directory: frontend
        run: npm run build
